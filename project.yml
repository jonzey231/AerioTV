# XcodeGen spec for AerioTV.
#
# v1.6.22 (Codex finding 2): rewritten to match the actual checked-in
# Xcode project. The previous spec was a stale mirror of a much older
# `Dispatcharr`-branded ancestor and would have produced an unsignable
# project shape if anyone regenerated from it. Identifiers, bundle IDs,
# entitlements, and resource paths now match `Aerio.xcodeproj/project.pbxproj`.
#
# This file is informational, not authoritative. The canonical project
# is `Aerio.xcodeproj`. If you regenerate, diff against the checked-in
# `.pbxproj` and reconcile any drift before committing.
name: Aerio
options:
  bundleIdPrefix: app.molinete
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_BITCODE: "NO"
    SUPPORTS_MACCATALYST: "YES"
    MARKETING_VERSION: "1.6.22"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # Leave blank so a fork can sign under its own team without
    # editing this file. The checked-in `.pbxproj` carries Archie's
    # personal team ID; that's expected for the maintained build.
    DEVELOPMENT_TEAM: ""

targets:
  Aerio:
    type: application
    platform: [iOS, tvOS]
    deploymentTarget:
      iOS: "18.0"
      tvOS: "18.0"
    sources:
      - path: .
        excludes:
          - "**/*.xcodeproj/**"
          - "**/build/**"
          - "**/DerivedData/**"
          - "project.yml"
          - "BUILD.md"
          - "CHANGELOG.md"
          - "README.md"
          - "TopShelfExtension/**"
    resources:
      - path: App/AerioSplash.mp4
      - path: SupportingFiles/Assets.xcassets
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleDisplayName: AerioTV
        CFBundleIdentifier: app.molinete.aerio
        CFBundleShortVersionString: "1.6.22"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: false
    entitlements:
      path: Aerio_tvOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.molinete.aerio.topshelf
    dependencies:
      - target: AerioTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.molinete.aerio
        INFOPLIST_FILE: SupportingFiles/Info.plist

  AerioTopShelf:
    type: tv-top-shelf-extension
    platform: tvOS
    deploymentTarget:
      tvOS: "18.0"
    sources:
      - path: TopShelfExtension
    entitlements:
      path: TopShelfExtension/AerioTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.molinete.aerio.topshelf
    info:
      properties:
        CFBundleDisplayName: AerioTopShelf
        CFBundleIdentifier: app.molinete.aerio.TopShelf
        CFBundleShortVersionString: "1.6.22"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ContentProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.molinete.aerio.TopShelf
        SWIFT_VERSION: "6.0"
    frameworks:
      - sdk: TVServices.framework
